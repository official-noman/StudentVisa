{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <h1 class="mb-3 fw-bold">{{ service.title }}</h1>
            <p class="text-secondary fs-5">{{ service.subtitle }}</p>
            {% if service.image %}
            <img src="{{ service.image.url }}" class="img-fluid rounded mb-4 w-100" alt="{{ service.title }}"
                style="max-height: 400px; object-fit: cover;">
            {% endif %}
            <div class="service-content lead">
                {{ service.content|safe }}
            </div>
            <a href="{% url 'home' %}" class="btn btn-secondary mt-4">&larr; Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
