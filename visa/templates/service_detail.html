{% extends 'base.html' %}
{% load static %}

{% block custom_css %}
<style>
    /* Hero Banner */
    .service-hero-section {
        position: relative;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .service-hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.55);
    }

    .service-hero-content {
        position: relative;
        z-index: 2;
        text-align: center;
        color: #fff;
        padding: 60px 20px;
    }

    .service-hero-content h1 {
        font-size: 42px;
        font-weight: 700;
        margin-bottom: 15px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .service-hero-content .breadcrumb-nav {
        display: flex;
        justify-content: center;
        gap: 10px;
        font-size: 16px;
    }

    .service-hero-content .breadcrumb-nav a {
        color: #f0f0f0;
        text-decoration: none;
    }

    .service-hero-content .breadcrumb-nav a:hover {
        color: #fff;
        text-decoration: underline;
    }

    .service-hero-content .breadcrumb-nav span {
        color: #ccc;
    }

    /* Main Content Area */
    .service-content-section {
        padding: 50px 0;
    }

    .service-content-section .content-box {
        line-height: 1.8;
        font-size: 16px;
        color: #333;
    }

    .service-content-section .content-box h2,
    .service-content-section .content-box h3,
    .service-content-section .content-box h4 {
        margin-top: 25px;
        margin-bottom: 15px;
        color: #222;
        font-weight: 600;
    }

    .service-content-section .content-box h2 {
        font-size: 28px;
    }

    .service-content-section .content-box h3 {
        font-size: 24px;
    }

    .service-content-section .content-box h4 {
        font-size: 20px;
    }

    .service-content-section .content-box p {
        margin-bottom: 15px;
    }

    .service-content-section .content-box ul,
    .service-content-section .content-box ol {
        margin-bottom: 15px;
        padding-left: 25px;
    }

    .service-content-section .content-box li {
        margin-bottom: 8px;
    }

    .service-content-section .content-box table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }

    .service-content-section .content-box table th,
    .service-content-section .content-box table td {
        border: 1px solid #ddd;
        padding: 10px 15px;
        text-align: left;
    }

    .service-content-section .content-box table th {
        background-color: #f5f5f5;
        font-weight: 600;
    }

    .service-content-section .content-box blockquote {
        border-left: 4px solid #007bff;
        padding: 15px 20px;
        margin: 20px 0;
        background: #f8f9fa;
        font-style: italic;
    }

    .service-content-section .content-box img {
        max-width: 100%;
        height: auto;
        border-radius: 5px;
        margin: 15px 0;
    }

    .service-content-section .content-box a {
        color: #007bff;
        text-decoration: underline;
    }

    .service-content-section .content-box a:hover {
        color: #0056b3;
    }

    @media (max-width: 768px) {
        .service-hero-content h1 {
            font-size: 28px;
        }

        .service-hero-section {
            min-height: 250px;
        }
    }
</style>
{% endblock custom_css %}

{% block content %}
<!-- Hero Banner Section -->
<section class="service-hero-section" style="background-image: url('{{ service.banner_image.url }}');">
    <div class="service-hero-overlay"></div>
    <div class="service-hero-content">
        <h1>{{ service.title }}</h1>
        <div class="breadcrumb-nav">
            <a href="{% url 'home' %}">Home</a>
            <span>/</span>
            <span>{{ service.title }}</span>
        </div>
    </div>
</section>

<!-- Main Content Section -->
<section class="service-content-section">
    <div class="auto-container">
        <div class="content-box">
            {{ service.main_content|safe }}
        </div>
    </div>
</section>
{% endblock content %}
